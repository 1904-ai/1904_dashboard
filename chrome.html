<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'">
  <title>1904 Desktop</title>
  <style>
    :root { color-scheme: dark; --canvas: #121416; --text: #e2e7ec; --line: #ffffff18; --hover: #ffffff14; }
    :root[data-theme="light"] { color-scheme: light; --canvas: #f6f8fa; --text: #20262d; --line: #00000016; --hover: #0000000c; }
    body { margin: 0; background: var(--canvas); color: var(--text); font: 500 12px system-ui, sans-serif; overflow: hidden; }
    header { box-sizing: border-box; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 150px 0 12px;
      border-bottom: 1px solid var(--line); -webkit-app-region: drag; user-select: none; }
    :root[data-platform="darwin"] header { padding: 0 12px 0 82px; }
    header img { width: 16px; height: 16px; border-radius: 4px; }
    button { -webkit-app-region: no-drag; display: grid; place-items: center; width: 28px; height: 24px;
      padding: 0; border: 0; border-radius: 5px; background: transparent; color: inherit; cursor: pointer; }
    button:hover, button:focus-visible { background: var(--hover); }
    button:focus-visible { outline: 1px solid currentColor; outline-offset: 1px; }
    @media (forced-colors: active) { header { border-color: CanvasText; } }
  </style>
</head>
<body>
  <header>
    <img src="assets/icon.png" alt="">
    <span>1904 Desktop</span>
    <button type="button" id="app-menu" aria-label="Application menu" title="Application menu" aria-haspopup="menu">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <circle cx="3" cy="8" r="1.15"/><circle cx="8" cy="8" r="1.15"/><circle cx="13" cy="8" r="1.15"/>
      </svg>
    </button>
  </header>
</body>
</html>
