name: Desktop checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run check
      - run: node --test test/desktop-links.test.cjs test/desktop-recovery.test.cjs test/computer-policy.test.cjs test/computer-approval.test.cjs test/computer-link.test.cjs test/computer-sandbox.test.cjs test/computer-proof.test.cjs test/computer-away.test.cjs test/computer-log.test.cjs test/computer-bridge.test.cjs test/computer-runner.test.cjs test/context-menu.test.cjs test/task-tab-keys.test.cjs test/startup-guard.test.cjs

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        # Mount only Git metadata so a PR cannot supply scanner settings or ignore files.
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE/.git:/repo/.git:ro" \
            --workdir /repo \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact=100 --ignore-gitleaks-allow \
            --log-opts='--all --full-history -m --no-ext-diff --no-textconv' /repo

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm audit --package-lock-only --ignore-scripts --include=dev --audit-level=high --registry=https://registry.npmjs.org/

  dependency-review:
    # Private repositories need GitHub Code Security to use dependency review.
    if: github.event_name == 'pull_request' && (!github.event.repository.private || vars.ENABLE_DEPENDENCY_REVIEW == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
