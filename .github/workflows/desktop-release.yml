name: Build signed desktop release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-*'
  workflow_dispatch:

concurrency:
  group: desktop-release
  queue: max

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.platform }}/${{ matrix.arch }}
    if: github.repository == '1904-ai/1904_dashboard'
    runs-on: ${{ matrix.runner }}
    environment: desktop-release
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            arch: x64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Sign and verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DESKTOP_WINDOWS_PUBLISHER: ${{ vars.DESKTOP_WINDOWS_PUBLISHER }}
          DESKTOP_SIGNING_ENDPOINT: ${{ vars.DESKTOP_SIGNING_ENDPOINT }}
          DESKTOP_SIGNING_ACCOUNT: ${{ vars.DESKTOP_SIGNING_ACCOUNT }}
          DESKTOP_SIGNING_PROFILE: ${{ vars.DESKTOP_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          npm run release:build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run release:verify
      - name: Sign, notarize, and verify Mac app
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_BASE64"
          umask 077
          export APPLE_API_KEY="$RUNNER_TEMP/1904-notary.p8"
          trap 'rm -f -- "$APPLE_API_KEY"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$APPLE_API_KEY"
          npm run release:build
          npm run release:verify
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: 1904-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-output/${{ matrix.platform }}/${{ matrix.arch }}/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish the signed desktop release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: 1904-desktop-*
          path: release-output/downloads
          digest-mismatch: error
      - run: npm ci --ignore-scripts
      - run: node --test test/release-assets.test.cjs
      - run: npm run release:assemble
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: 1904-github-release
          path: release-output/github/
          if-no-files-found: error
          compression-level: 0
      - name: Publish release after uploading verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "1904 Desktop ${GITHUB_REF_NAME#v}" release-output/github/*
