<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'">
  <title>1904 Notification</title>
  <style>
    :root {
      color-scheme: dark;
      --surface: #181b1e;
      --surface-subtle: #1f2327;
      --text: #e2e7ec;
      --muted: #9aa5b0;
      --border: #ffffff1f;
      --hover: #ffffff14;
      --edge: #ffffff30;
      --primary: #e2e7ec;
      --on-primary: #121416;
      --attention: #d9a441;
      --ready: #5cc489;
      --focus: #7aa7ff;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.42), 0 2px 6px rgba(0, 0, 0, 0.28);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --surface: #ffffff;
      --surface-subtle: #f6f8fa;
      --text: #20262d;
      --muted: #59636e;
      --border: #00000018;
      --hover: #0000000c;
      --edge: #00000028;
      --primary: #20262d;
      --on-primary: #ffffff;
      --attention: #b57600;
      --ready: #1f7a46;
      --focus: #2f6fe0;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.16), 0 2px 6px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font: 400 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      user-select: none;
    }
    .stage {
      padding: 8px;
    }
    .drawer {
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 13px 14px 14px;
      opacity: 0;
      transform: translateX(18px);
      transition: transform 170ms cubic-bezier(0.22, 1, 0.36, 1), opacity 150ms ease-out;
    }
    .drawer[data-state="open"] {
      opacity: 1;
      transform: translateX(0);
    }
    .drawer[data-state="closing"] {
      opacity: 0;
      transform: translateX(18px);
    }
    .them {
      direction: ltr;
      unicode-bidi: isolate;
      overflow-wrap: anywhere;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .logo {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      flex: none;
    }
    .logo[hidden] { display: none; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--muted);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ready);
      flex: none;
    }
    .drawer[data-kind="task_needs_you"] .dot {
      background: var(--attention);
    }
    .queued {
      font-size: 11px;
      font-weight: 550;
      color: var(--muted);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 7px;
    }
    .queued[hidden] { display: none; }
    .icon-close {
      margin-left: auto;
      display: grid;
      place-items: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .icon-close:hover {
      background: var(--hover);
      color: var(--text);
    }
    .title {
      margin: 0;
      font-size: 13.5px;
      font-weight: 650;
      line-height: 1.35;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .body {
      margin: 4px 0 0;
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }
    button.btn {
      font: 600 12.5px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 30px;
      padding: 0 12px;
      border-radius: 7px;
      border: 1px solid var(--edge);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: background-color 120ms ease, filter 120ms ease;
    }
    button.btn:hover {
      background: var(--hover);
    }
    button.btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary);
    }
    button.btn.primary:hover {
      background: var(--primary);
      filter: brightness(1.08);
    }
    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .progress-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--border);
    }
    .progress-fill {
      width: 100%;
      height: 100%;
      background: var(--ready);
      transform-origin: left center;
      transform: scaleX(1);
    }
    .drawer[data-kind="task_needs_you"] .progress-fill {
      background: var(--attention);
    }
    @media (prefers-reduced-motion: reduce) {
      .drawer {
        transition: none;
        transform: none;
      }
      .drawer[data-state="closing"] {
        transform: none;
      }
    }
    @media (forced-colors: active) {
      .drawer { border: 1px solid CanvasText; }
      .progress-fill { background: Highlight; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <section class="drawer" id="drawer" role="status" aria-live="polite" data-state="idle">
      <div class="header">
        <img class="logo" id="logo" alt="" hidden>
        <span class="status"><span class="dot" aria-hidden="true"></span><span id="badge"></span></span>
        <span class="queued" id="queued" hidden></span>
        <button type="button" class="icon-close" id="dismiss-icon" aria-label="Close notification" title="Close">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M3.5 3.5l7 7M10.5 3.5l-7 7"/>
          </svg>
        </button>
      </div>
      <h1 class="title them" id="title"></h1>
      <p class="body them" id="body"></p>
      <div class="actions">
        <button type="button" class="btn primary" id="open">Open Task</button>
        <button type="button" class="btn" id="close">Close</button>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress"></div>
      </div>
    </section>
  </div>
</body>
</html>
