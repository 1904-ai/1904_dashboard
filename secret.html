<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <title>Deploy From This Computer</title>
  <style>
    :root { color-scheme: dark; --canvas: #121416; --panel: #181b1e; --text: #e2e7ec; --muted: #9aa5b0; --edge: #ffffff38; --hover: #ffffff14; --focus: #7ab7ff; }
    :root[data-theme="light"] { color-scheme: light; --canvas: #f6f8fa; --panel: #ffffff; --text: #20262d; --muted: #59636e; --edge: #00000030; --hover: #0000000c; --focus: #0b62d6; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: var(--canvas); color: var(--text); font: 400 13px/1.45 system-ui, sans-serif; }
    h1 { margin: 0; font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
    p { margin: 6px 0 0; color: var(--muted); overflow-wrap: anywhere; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input { width: 100%; color: inherit; background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 7px 9px; font: inherit; }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin: 18px 0 0; }
    button { font: 550 12px system-ui, sans-serif; color: inherit; background: transparent; border: 1px solid var(--edge); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
    button.primary { background: var(--text); color: var(--canvas); border-color: var(--text); }
    button:hover:not(:disabled) { background: var(--hover); }
    button.primary:hover:not(:disabled) { background: var(--text); opacity: .88; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <form id="form" autocomplete="off">
    <h1 id="heading"></h1>
    <p id="detail"></p>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="off" spellcheck="false">
    <div class="actions">
      <button type="button" id="cancel">Cancel</button>
      <button type="submit" class="primary" id="continue" disabled>Deploy</button>
    </div>
  </form>
</body>
</html>
